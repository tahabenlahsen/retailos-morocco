# Production stack: PostgreSQL + Redis + app + Caddy (automatic HTTPS) + daily cron.
# Copy .env.example to .env and set at least: POSTGRES_PASSWORD, NEXTAUTH_SECRET, DOMAIN, CRON_SECRET.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailos}
      POSTGRES_USER: ${POSTGRES_USER:-retailos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailos} -d ${POSTGRES_DB:-retailos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-retailos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-retailos}?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: https://${DOMAIN:-localhost}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN:-localhost}
      CRON_SECRET: ${CRON_SECRET:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

  # TLS termination + reverse proxy. Automatic Let's Encrypt certificates for DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily maintenance (sales-drop detection, stock sweep, token purge) — runs at 06:00 every day.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on: [app]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ "$(date +%H:%M)" = "06:00" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" http://app:3000/api/cron/daily || true
            sleep 61
          fi
          sleep 30
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
